<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="contenedor">
    <form id="loginForm" class="login" novalidate>
      <h1>Iniciar sesión</h1>
      <p class="ayuda">Acceso de demostración del laboratorio.</p>

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="username" />

      <label for="password">Contraseña</label>
      <div class="campo-password">
        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password" />
        <button type="button" id="togglePassword" aria-label="Mostrar u ocultar contraseña">Mostrar</button>
      </div>

      <button type="submit" class="boton">Entrar</button>
      <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
